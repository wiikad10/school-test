
name: CI - Demo HTML JavaScript

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Check JavaScript syntax
      - name: Check JavaScript
        run: node --check script.js

      # 4. Check HTML file
      - name: Check HTML
        run: test -f index.html

      # 5. Success message
      - name: Finish verification
        run: echo "All checks passed!"
